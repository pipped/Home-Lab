global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'homelab-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  # Pi-hole v6 no longer exposes the old unauthenticated /admin/api.php endpoint.
  # Its current /api endpoints return authenticated JSON, so Prometheus needs
  # a dedicated exporter before Pi-hole metrics can be scraped directly.
