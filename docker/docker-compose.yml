services:

  # PORTAINER - Container management UI
  # Access: http://localhost:9000
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - labnet

  # PI-HOLE - DNS ad blocker
  # Access: http://localhost:8081/admin
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80"
    environment:
      TZ: ${TZ:-America/New_York}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-changeme123}
      FTLCONF_dns_listeningMode: ${PIHOLE_DNS_LISTENING_MODE:-ALL}
      DNS1: 1.1.1.1
      DNS2: 1.0.0.1
    volumes:
      - pihole_data:/etc/pihole/
      - pihole_dnsmasq:/etc/dnsmasq.d/
    networks:
      - labnet
    cap_add:
      - NET_ADMIN

  # PI-HOLE EXPORTER - Prometheus metrics for Pi-hole v6
  # Scraped by Prometheus at http://pihole-exporter:9617/metrics
  pihole-exporter:
    image: ekofr/pihole-exporter:latest
    container_name: pihole-exporter
    restart: always
    environment:
      PIHOLE_HOSTNAME: pihole
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:-changeme123}
      PIHOLE_PORT: 80
      INTERVAL: 30s
      PORT: 9617
    depends_on:
      - pihole
    networks:
      - labnet

  # PROMETHEUS - Metrics collection
  # Access: http://localhost:9090
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - labnet

  # NODE EXPORTER - Host machine metrics
  # Scraped by Prometheus at http://node-exporter:9100
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - labnet

  # CADVISOR - Per-container metrics
  # Access: http://localhost:8080
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - labnet

  # GRAFANA - Dashboards and visualization
  # Access: http://localhost:3000 (admin / GF_SECURITY_ADMIN_PASSWORD)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      TZ: ${TZ:-America/New_York}
    volumes:
      - ../configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - labnet

  # UPTIME KUMA - Service uptime monitoring
  # Access: http://localhost:3001
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - labnet

  # NGINX PROXY MANAGER - Reverse proxy with SSL
  # Admin UI: http://localhost:81 (admin@example.com / changeme)
  # HTTP:     http://localhost:80
  # HTTPS:    https://localhost:443
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - labnet

networks:
  labnet:
    driver: bridge

volumes:
  portainer_data:
  pihole_data:
  pihole_dnsmasq:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
  npm_data:
  npm_letsencrypt:
