# Simple home lab with 4 core services for learning
# No complex configuration needed - just works out of the box!

services:
  # PORTAINER - Easy container management UI
  # Access: http://localhost:9000
  # Purpose: Visually manage Docker containers, images, and volumes
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - labnet

  # PI-HOLE - Ad blocking DNS server
  # Access: http://localhost/admin (password: changeme123)
  # Purpose: Filter ads and track DNS queries for the network
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80"
    environment:
      TZ: ${TZ:-America/New_York}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-changeme123}
      FTLCONF_dns_listeningMode: ${PIHOLE_DNS_LISTENING_MODE:-ALL}
      DNS1: 1.1.1.1
      DNS2: 1.0.0.1
    volumes:
      - pihole_data:/etc/pihole/
      - pihole_dnsmasq:/etc/dnsmasq.d/
    networks:
      - labnet
    cap_add:
      - NET_ADMIN

  # PROMETHEUS - Collect metrics about your services
  # Access: http://localhost:9090
  # Purpose: Store and track system metrics (CPU, memory, etc.)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - labnet

  # GRAFANA - Make cool dashboards from metrics
  # Access: http://localhost:3000 (admin/admin123)
  # Purpose: Create visualizations and alerts from Prometheus data
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      TZ: ${TZ:-America/New_York}
    volumes:
      - ../configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - labnet

# Network and storage
networks:
  labnet:
    driver: bridge

volumes:
  portainer_data:
  pihole_data:
  pihole_dnsmasq:
  prometheus_data:
  grafana_data:
